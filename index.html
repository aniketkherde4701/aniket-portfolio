<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%23121211%22/%3E%3Ctext x=%2216%22 y=%2221%22 font-family=%22monospace%22 font-size=%2213%22 font-weight=%22700%22 fill=%22%23fff%22 text-anchor=%22middle%22%3EAK%3C/text%3E%3C/svg%3E">
<title>Aniket Kherde · AI-native product designer</title>
<meta name="description" content="Aniket Kherde, AI-native product designer. An agent desk that prepares the portfolio for whoever is reading.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f1f0eb; --panel:#fbfaf6; --sunk:#e9e7e0; --ink:#121211; --ink2:#4f4d47; --ink3:#86837a;
  --line:#d8d5cb; --line2:#e4e1d8; --grid:rgba(18,18,17,.045);
  --acc:#ff4b14; --acc-soft:#ffe3d6; --acc-ink:#fff;
  --del:#bf3328; --del-bg:#f9e2de; --add:#13774a; --add-bg:#dcf0e3; --ev:#2a52cc; --ev-bg:#e2e8fb;
  --warn:#8a5a00; --warn-bg:#f6ead0; --teal:#0b6f6c; --teal-bg:#d7eeec; --peach:#9a4a1c; --peach-bg:#fbe4d4;
  --shadow:0 1px 0 rgba(0,0,0,.03),0 8px 24px -12px rgba(0,0,0,.18);
  --f-disp:"Archivo",ui-sans-serif,system-ui,sans-serif; --f-body:"Inter",ui-sans-serif,system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --gut:max(16px,env(safe-area-inset-left)); --gutr:max(16px,env(safe-area-inset-right));
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f0f0e; --panel:#171715; --sunk:#1e1e1b; --ink:#edece6; --ink2:#aeaba2; --ink3:#77746c;
  --line:#2f2e2a; --line2:#252421; --grid:rgba(237,236,230,.04);
  --acc:#ff6a3a; --acc-soft:#3a1d12; --acc-ink:#140a05;
  --del:#ff8577; --del-bg:#3a1a16; --add:#5fd395; --add-bg:#13301f; --ev:#8ea9ff; --ev-bg:#1a2340;
  --warn:#f0c068; --warn-bg:#33270f; --teal:#5fd0cb; --teal-bg:#102f2e; --peach:#ffb48a; --peach-bg:#36200f;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0f0f0e; --panel:#171715; --sunk:#1e1e1b; --ink:#edece6; --ink2:#aeaba2; --ink3:#77746c;
  --line:#2f2e2a; --line2:#252421; --grid:rgba(237,236,230,.04);
  --acc:#ff6a3a; --acc-soft:#3a1d12; --acc-ink:#140a05;
  --del:#ff8577; --del-bg:#3a1a16; --add:#5fd395; --add-bg:#13301f; --ev:#8ea9ff; --ev-bg:#1a2340;
  --warn:#f0c068; --warn-bg:#33270f; --teal:#5fd0cb; --teal-bg:#102f2e; --peach:#ffb48a; --peach-bg:#36200f;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark;}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-attachment:fixed}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);display:flex;gap:8px;align-items:center}
.lbl b{color:var(--ink);font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;height:52px;padding:0 var(--gutr) 0 var(--gut);
  background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:600 14px/1 var(--f-disp);font-stretch:110%;letter-spacing:-.01em;white-space:nowrap}
.brand i{width:22px;height:22px;border-radius:5px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:600 10px/1 var(--f-mono);font-style:normal}
.agent-state{display:flex;align-items:center;gap:8px;font:500 11px/1 var(--f-mono);color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--add);box-shadow:0 0 0 3px var(--add-bg)}
.dot.busy{background:var(--acc);box-shadow:0 0 0 3px var(--acc-soft);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.top nav{margin-left:auto;display:flex;gap:4px;align-items:center}
#theme svg{display:block}
.dock .scopes:has(> .all){display:none}
.top nav a,.top nav button{font:500 13px/1 var(--f-body);text-decoration:none;padding:8px 10px;border-radius:6px;border:0;background:none;color:var(--ink2)}
.top nav a:hover,.top nav button:hover{color:var(--ink);background:var(--sunk)}
.top nav .cta{background:var(--ink);color:var(--paper)}
.top nav .cta:hover{background:var(--ink);color:var(--paper);opacity:.88}
@media (max-width:760px){.top nav .hide-s{display:none}.agent-state span{display:none}}

/* hero */
.hero{padding:30px var(--gutr) 26px var(--gut);max-width:1440px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;align-items:end;border-bottom:1px solid var(--line)}
.hero h1{margin:12px 0 0;font:500 clamp(32px,4.2vw,60px)/1 var(--f-disp);font-stretch:112%;letter-spacing:-.035em;max-width:19ch;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--acc)}
.hero h1 .gx[hidden]{display:none}
.hero h1 .gx{display:block;font-size:.42em;letter-spacing:-.01em;line-height:1.15;color:var(--del);text-decoration:line-through;text-decoration-thickness:2px;margin-bottom:.35em;font-stretch:100%}
.hero .sub{margin:14px 0 0;color:var(--ink2);font-size:16px;max-width:56ch}
.hero .meta{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.hero .meta div{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-top:1px solid var(--line2);font-size:13px}
.hero .meta div:first-child{border-top:0}
.hero .meta dt{font:500 10.5px/1.6 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.hero .meta dd{margin:0;text-align:right}
.gen{margin-top:16px;display:inline-flex;gap:8px;align-items:center;font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);background:none;border:1px dashed var(--line);border-radius:999px;padding:7px 11px}
.gen:hover{color:var(--ink);border-color:var(--ink3)}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:16px;padding-top:24px}.hero .meta{display:none}.hero .sub{font-size:15px}}

/* desk layout */
.desk{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:340px minmax(0,1fr);gap:0}
.side{border-right:1px solid var(--line);padding:24px 20px 40px var(--gut);position:sticky;top:52px;align-self:start;max-height:calc(100vh - 52px);overflow:auto;scrollbar-width:thin}
.side section{padding:0 0 22px;margin:0 0 22px;border-bottom:1px solid var(--line2)}
.side section:last-child{border-bottom:0}
.side h2{margin:0 0 12px;font:500 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);display:flex;justify-content:space-between}
.side h2 span:first-child::before{content:"[ ";color:var(--ink3)}
.side h2 span:first-child::after{content:" ]"}
.side h2 b{color:var(--ink);font-weight:500}
.readers{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 12px;font-size:13px;line-height:1.1;white-space:nowrap;transition:background .15s,border-color .15s}
.pill:hover{border-color:var(--ink3)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:5px;padding:8px 0;font:500 12px/1 var(--f-mono);color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.hint{margin:10px 0 0;font-size:12.5px;color:var(--ink3);line-height:1.45}

/* ask */
.ask .box,.dock .box{border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:var(--shadow)}
.box .scopes{display:flex;flex-wrap:wrap;gap:6px;padding:10px 10px 0}
.sc{display:inline-flex;align-items:center;gap:6px;font:500 11.5px/1 var(--f-mono);padding:5px 6px 5px 8px;border-radius:5px;background:var(--ev-bg);color:var(--ev)}
.sc.all{background:var(--sunk);color:var(--ink2);padding-right:8px}
.sc button{border:0;background:none;padding:0 2px;color:inherit;font-size:13px;line-height:1}
.box form{display:flex;gap:6px;padding:8px}
.box input{flex:1;min-width:0;border:0;background:none;font:400 14px/1.4 var(--f-body);color:var(--ink);padding:6px 4px;outline:none}
.box input::placeholder{color:var(--ink3)}
.go{border:0;background:var(--acc);color:var(--acc-ink);border-radius:7px;padding:0 12px;font:600 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;min-height:34px}
.sugg{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.sugg button{text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;font-size:13px;color:var(--ink2)}
.sugg button::before{content:"→ ";color:var(--ink3);font-family:var(--f-mono)}
.sugg button:hover{background:var(--sunk);color:var(--ink)}
.answer{margin-top:12px;border-left:2px solid var(--acc);padding:2px 0 2px 12px}
.answer .q{font:500 11px/1.4 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);margin-bottom:8px}
.answer .it{margin:0 0 10px;font-size:13.5px}
.answer .it b{display:block;font-weight:600}
.answer .cite{font:500 11px/1 var(--f-mono);color:var(--ev);background:var(--ev-bg);border:0;padding:3px 6px;border-radius:4px;margin-left:4px;vertical-align:1px}
.answer .none{font-size:13.5px;color:var(--ink2)}
.small{font-size:12px;color:var(--ink3);margin:8px 0 0}

/* run log */
.log{font:400 11.5px/1.7 var(--f-mono);color:var(--ink2)}
.log summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.log summary::-webkit-details-marker{display:none}
.log summary::after{content:"+";color:var(--ink3)}
.log[open] summary::after{content:"−"}
.log ol{list-style:none;margin:10px 0 0;padding:0}
.log li{display:grid;grid-template-columns:42px 14px 1fr;gap:6px;animation:in .25s ease both}
.log li .t{color:var(--ink3)}
.log li .k{color:var(--add)}
.log li.run .k{color:var(--acc)}
@keyframes in{from{opacity:0;transform:translateY(3px)}}

/* board */
.main{padding:24px var(--gutr) 60px 28px;min-width:0}
.bhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.bhead .lbl{flex-wrap:wrap}
.diffbar{display:none;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px;padding:10px 12px;border:1px dashed var(--ev);border-radius:10px;background:var(--ev-bg);font-size:13px}
.diffbar.on{display:flex;animation:in .25s ease both}
.diffbar .msg{flex:1;min-width:200px}
.diffbar .msg code{font:500 11.5px/1 var(--f-mono);padding:2px 5px;border-radius:4px;background:var(--panel);margin:0 2px;white-space:nowrap}
.diffbar .msg code.up{color:var(--add)} .diffbar .msg code.dn{color:var(--del)} .diffbar .msg code.dim{color:var(--ink3)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 11px;font:500 12px/1 var(--f-body)}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.ok{background:var(--add);color:#fff;border-color:var(--add)}
:root[data-theme="dark"] .btn.ok{color:#04140b}
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tldr{grid-column:1/-1;border:1px solid var(--ink);border-radius:12px;background:var(--panel);padding:18px 20px;display:none}
.t30 .tldr{display:block}
.tldr ol{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:t}
.tldr li{counter-increment:t;display:grid;grid-template-columns:28px 1fr;font-size:15px}
.tldr li::before{content:"0" counter(t);font:500 11px/1.9 var(--f-mono);color:var(--acc)}
.tldr a{color:var(--ev)}
.tile{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;transition:opacity .3s,border-color .2s,box-shadow .2s}
.tile.first{grid-column:1/-1}
.tile.dim{opacity:.55}
.tile.dim:hover,.tile.dim:focus-within{opacity:1}
.tile.cited{border-color:var(--ev);box-shadow:0 0 0 3px var(--ev-bg),var(--shadow)}
.tile.scoped{border-color:var(--ev)}
.tile.skel{min-height:240px;background:linear-gradient(90deg,var(--panel) 30%,var(--sunk) 50%,var(--panel) 70%) 0 0/300% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{to{background-position:-150% 0}}
.th{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 16px 0}
.th .ix{font:500 11px/1 var(--f-mono);color:var(--ink3)}
.th h3{margin:0;font:600 22px/1.1 var(--f-disp);font-stretch:108%;letter-spacing:-.02em}
.th .ty{font-size:13px;color:var(--ink2)}
.st{margin-left:auto;font:500 10.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;padding:5px 7px;border-radius:5px;white-space:nowrap}
.st.warn{background:var(--warn-bg);color:var(--warn)} .st.neu{background:var(--sunk);color:var(--ink2)} .st.ok{background:var(--add-bg);color:var(--add)}
.lens{margin:10px 16px 0;padding:8px 10px;border-radius:7px;background:var(--acc-soft);font-size:13px;display:flex;gap:8px;animation:in .3s ease both}
.lens::before{content:"+";font:600 12px/1.5 var(--f-mono);color:var(--acc)}
.role{margin:6px 16px 0;font:400 11px/1.5 var(--f-mono);color:var(--ink3);letter-spacing:.02em}
.wn{padding:12px 16px 0;display:grid;gap:4px;font-size:13.5px}
.wn div{display:grid;grid-template-columns:16px 1fr;gap:4px}
.wn .w{color:var(--ink2)} .wn .w::before{content:"−";color:var(--del);font-family:var(--f-mono)}
.wn .n{color:var(--ink);font-weight:500} .wn .n::before{content:"+";color:var(--add);font-family:var(--f-mono)}
.demo{margin:14px 16px 0;border:1px solid var(--line2);border-radius:9px;background:var(--paper);overflow:hidden}
.t30 .demo,.t30 .dcap{display:none}
.dcap{margin:6px 16px 0;font:400 10.5px/1.4 var(--f-mono);color:var(--ink3);letter-spacing:.02em;display:flex;justify-content:space-between;gap:8px}
.decs{display:none;margin:14px 16px 0;border-top:1px solid var(--line2);padding-top:12px}
.t20 .decs{display:block}
.decs h4{margin:0 0 8px;font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.decs ol{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.decs li{display:grid;grid-template-columns:22px 1fr;font-size:13.5px}
.decs li span{font:500 11px/1.7 var(--f-mono);color:var(--ink3)}
.tf{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px 14px;margin-top:auto}
.scope-btn{border:1px dashed var(--line);background:none;border-radius:6px;padding:6px 9px;font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)}
.scope-btn[aria-pressed="true"]{border-style:solid;border-color:var(--ev);color:var(--ev);background:var(--ev-bg)}
.open{font:600 13px/1 var(--f-body);text-decoration:none;display:inline-flex;gap:6px;align-items:center;padding:9px 12px;border-radius:7px;background:var(--ink);color:var(--paper)}
.open:hover{opacity:.88}
@media (max-width:1100px){.desk{grid-template-columns:300px minmax(0,1fr)}}
@media (max-width:900px){
  .desk{grid-template-columns:1fr}
  .side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:20px var(--gutr) 4px var(--gut);display:grid;gap:0}
  .main{padding:20px var(--gutr) 40px var(--gut)}
  .board{grid-template-columns:1fr}
  .readers{flex-wrap:nowrap;overflow-x:auto;margin:0 calc(-1 * var(--gutr)) 0 calc(-1 * var(--gut));padding:0 var(--gutr) 4px var(--gut);scrollbar-width:none}
  .side .ask-sec{display:none}
  body.home{padding-bottom:84px}
}

/* mobile ask dock */
.dock{display:none}
@media (max-width:900px){
  .dock{display:block;position:fixed;z-index:40;left:0;right:0;bottom:0;padding:10px var(--gutr) max(10px,env(safe-area-inset-bottom)) var(--gut);background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
  .dock .sheet{max-height:52vh;overflow:auto;padding-bottom:6px}
  .dock .sheet:empty{display:none}
  body:not(.home) .dock{display:none}
}

/* demos */
.sheet-demo{padding:10px;display:grid;gap:10px}
.grid5{display:grid;grid-template-columns:28px repeat(4,minmax(0,1fr));font:400 12.5px/1 var(--f-mono);border:1px solid var(--line);border-radius:6px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;background:var(--panel)}
.grid5 div{padding:8px 7px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:31px;position:relative}
.grid5 .hd{background:var(--sunk);color:var(--ink3);font-size:10.5px;text-align:center;padding:6px 2px;min-height:0}
.grid5 .c{cursor:cell}
.grid5 .c.num{text-align:right}
.grid5 .c.sel{background:var(--ev-bg);box-shadow:inset 0 0 0 1px var(--ev)}
.grid5 .c.chg{background:var(--add-bg)}
.grid5 .c.chg .old{display:block;color:var(--del);text-decoration:line-through;font-size:10px;margin-bottom:3px}
.grid5 .c.chg .nw{color:var(--add);font-weight:600}
.grid5 .c.skip{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--line2) 4px 5px)}
.grid5 .c.tall{min-height:44px}
.prompt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--panel)}
.prompt .sc{flex:none}
.prompt .say{flex:1;min-width:120px;font-size:13px;color:var(--ink2)}
.res{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.res .sp{flex:1}
.chart-demo{padding:10px 12px 12px}
.chart-demo svg{display:block;width:100%;height:auto}
.chart-demo .row{display:flex;gap:10px;align-items:center;font:500 11.5px/1 var(--f-mono);color:var(--ink2);margin-top:6px}
.chart-demo input[type=range]{flex:1;accent-color:var(--acc)}
.chart-demo .ds{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.chart-demo .ds button{font:500 11px/1 var(--f-mono);border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:5px 7px;color:var(--ink2)}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:36px auto 0;max-width:900px}

/* flows */
.flows{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:44px}
.flows>div{padding:0 32px;display:flex;flex-direction:column;align-items:center;gap:0}

.flows .b .tg{color:var(--del);border:1px solid color-mix(in srgb,var(--del) 40%,transparent)} .flows .a .tg{color:var(--add);border:1px solid color-mix(in srgb,var(--add) 40%,transparent)}
.fbox{width:100%;max-width:340px;text-align:center;font-size:14px;padding:12px 14px;border-radius:9px}
.b .fbox{background:var(--del-bg);border:1px solid color-mix(in srgb,var(--del) 25%,transparent)}
.a .fbox{background:var(--add-bg);border:1px solid color-mix(in srgb,var(--add) 25%,transparent)}
.farr{font:500 13px/1 var(--f-mono);padding:6px 0}
.b .farr{color:var(--del)} .a .farr{color:var(--add)}
.fsum{margin-top:16px;font:500 11px/1.3 var(--f-mono);padding:6px 10px;border-radius:999px;text-align:center}
.b .fsum{color:var(--del);border:1px solid color-mix(in srgb,var(--del) 40%,transparent)} .a .fsum{color:var(--add);border:1px solid color-mix(in srgb,var(--add) 40%,transparent)}
.branch{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:400px}
.branch .fbox{font-weight:600;font-size:13px;padding:10px 6px}
.branch2{display:grid;grid-template-columns:2fr 1fr;gap:8px;width:100%;max-width:400px}
.branch2 .fbox{font-size:12.5px;background:var(--panel)!important}
/* product loop diagram */
.loop3{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
.loop3 div{border:1px solid var(--pa-line);background:var(--panel);border-radius:10px;padding:12px 16px;text-align:center;min-width:120px}
.loop3 b{display:block;font-size:14px}.loop3 small{color:var(--ink3);font-size:12px}
.loop3 i{font-style:normal;font-family:var(--f-mono);color:var(--pa)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:56px;align-items:center}
.split.rev>:first-child{order:2}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.stats div{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 16px;text-align:center;min-width:130px}
.stats b{display:block;font:600 26px/1.1 var(--f-disp);font-stretch:108%;color:var(--pa)}
.stats span{font-size:12px;color:var(--ink3)}
.bachips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.bachips span{font-size:12.5px;padding:6px 11px;border-radius:999px}
.bachips .b{color:var(--del);border:1px solid color-mix(in srgb,var(--del) 40%,transparent)} .bachips .a{color:var(--add);border:1px solid color-mix(in srgb,var(--add) 40%,transparent)}
/* sigma diff key */
.dk{border-top:3px solid}
.dk.r{border-top-color:var(--del)} .dk.g{border-top-color:var(--add)} .dk.bl{border-top-color:var(--ev)}

.dk.r .sample{border:1.5px dashed var(--del);background:var(--del-bg);color:var(--ink3)}
.dk.g .sample{border:1.5px solid var(--add);background:var(--add-bg)}
.dk.bl .sample{border:1.5px solid var(--ev);background:var(--ev-bg)}
.dk .ty{font:600 10.5px/1 var(--f-mono);letter-spacing:.06em}
.dk.r .ty{color:var(--del)} .dk.g .ty{color:var(--add)} .dk.bl .ty{color:var(--ev)}
/* tree */
.tree{display:flex;flex-direction:column;align-items:center;margin:40px 0}

.tree .row::before{content:"";position:absolute;top:0;left:16.6%;right:16.6%;height:24px;border:1px solid var(--pa-line);border-bottom:0;border-radius:8px 8px 0 0}
.tree .row .nd{min-width:0;background:var(--panel)}
.gal{display:grid;grid-template-columns:repeat(var(--c,3),minmax(0,1fr));gap:20px;margin-top:40px}
.gal figure{margin:0}

.out-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:900px;margin:0 auto}
.out-stats div{border:1px solid var(--pa-line);background:var(--panel);border-radius:12px;padding:22px;text-align:center}
.out-stats b{display:block;font:500 30px/1.1 var(--f-disp);font-stretch:110%;letter-spacing:-.02em;color:var(--pa);margin-bottom:6px}
.out-stats span{font-size:13px;color:var(--ink2)}
.tq{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:36px auto 0;max-width:1000px;padding-top:28px;border-top:1px solid var(--line)}

   {k:"steps",n:"02",lab:"Design challenge",h:"One interaction. Four moments.<br>A complete trust loop.",lead:"Every decision answered one question: does the user always know what the AI is doing, what it did, and how to undo it?",
    steps:[["Select + scope","The user selects cells. The AI is scoped to only those cells; nothing outside is touched."],["Execute","The AI works live. Changes appear in real time with colour coding, so the user watches it happen."],["Review","Every change is listed and categorised before anything is committed."],["Keep or discard","One click keeps everything or throws it all away. Control stays with the user."]]},
   {k:"gallery",n:"03",lab:"The interaction",tint:1,h:"The complete flow, step by step.",lead:"Shown with the example used throughout the prototype: Baseball Tourney data.",
    items:[["sigma-flow-1.png","Sheet with the AI panel on the right","1680/1040","1. Starting point","Chat input sits at the bottom of the panel."],["sigma-flow-2.png","Cells selected, “Add to chat” option showing","1680/1040","2. Select and scope","Adding to chat scopes the AI to only those cells."],["sigma-flow-3.png","Prompt box with the range chip","1680/1040","3. Prompt with context","The range appears as a chip; the user types the instruction."],["sigma-flow-4.png","Agent working banner and thinking state","1680/1040","4. Thinking state","The user can see something is happening."],["sigma-flow-5.png","Cells changing with colour codes","1680/1040","5. Live execution","Colour codes show exactly what type of change each is."],["sigma-flow-6.png","Review panel listing every change","1680/1040","6. Review and commit","Nothing is permanent until the user decides."]]},
   {k:"cards",n:"04",lab:"Key decision 01",h:"A diff system borrowed from code, applied to data.",lead:"The biggest anxiety with AI editing your data is not knowing what changed. After several iterations I landed on a three-colour change system drawn directly on the cells, the way developers review code changes in Git.",
    cards:[{dk:"r",sample:"Braves 13 8 5",t:"Red dashed border",ty:"DELETION",d:"Row or cell marked for deletion. Text is greyed to show it will be removed, but stays visible for review."},{dk:"g",sample:"Dodgers 9 1 15",t:"Green solid border",ty:"DATA UPDATE",d:"New or updated data. The value has changed."},{dk:"bl",sample:"Total 117",t:"Blue solid border",ty:"FORMULA OR LOGIC",d:"A formula added or changed. Blue signals structural logic, different from raw data."}],
    q:"Users can scan the whole sheet and see every change type at a glance, before reading a word in the chat panel."},
   {k:"decision",n:"04",lab:"Key decision 02",tint:1,h:"Scope the AI before it touches anything.",
    p:["The biggest trust problem with AI tools is unpredictability. Ask one to update two rows and it may rewrite the whole sheet.","I designed a <b>cell selection → Add to chat</b> flow where the selected range appears as a chip in the chat input. The AI can only write inside that range. The user sets the boundary before typing a word.","Scoping also protects cost: vague prompts on bulk data take more credits and time."],
    stats:[["A4:D5","Exact range shown as a chip"],["0","Cells outside the range touched"]],
    img:["sigma-scope.png","Selected range and the chip inside the chat input","2560/1936","Selection becomes context. Scope is set before the prompt."]},
   {k:"decision",n:"04",lab:"Key decision 03",rev:1,h:"Show the work.<br>Let the user decide.",
    p:["After running, the AI doesn't just say “done”. It enters <b>Review mode</b>, a named state that tells the user they're now in control.","Every change is listed in the chat panel by type: row deletion, data updated, formula added, chart added. Toolbar filter tabs (All / Data / Formula / Links / Visuals) let users audit by category. Per-change accept is designed but collapsed by default, and Keep all has a one-step undo."],
    q:"The mental model is a lawyer reviewing a contract before signing, not a chatbot that acts and hopes for the best.",
    img:["sigma-review.png","Laptop mockup: Review mode with categorised changes","16/10","Review mode: categorised changes, filter by type, commit when ready."]},
   {k:"gallery",n:"04",lab:"Key decision 04",tint:1,cols:4,h:"A spreadsheet and a chat panel. On a phone. At the same time.",lead:"On desktop the split is easy: sheet left, chat right. On mobile I had one screen and two interfaces that both needed to stay visible.",
    items:[["sigma-m1.png","Phone: sheet with a single input bar","864/1920","Sheet-first default","Chat is one input bar; the sheet gets the space."],["sigma-m2.png","Phone: prompt entry with keyboard","864/1920","Prompt entry","The sheet shrinks and the chat grows up from the bottom."],["sigma-m3.png","Phone: live execution","864/1920","Live execution","The colour system works the same on mobile."],["sigma-m4.png","Phone: review and commit","864/1920","Review + commit","The change list scrolls; Keep all stays reachable."]]},
   {k:"gallery",n:"05",lab:"Final designs",cols:4,h:"Desktop and mobile, complete.",lead:"The same interaction system on both surfaces: same colour logic, same trust loop.",
    top:["sigma-final-desktop.png","Laptop mockup: final desktop design","16/9"],
    items:[["sigma-final-m1.png","Phone: final screen 1","813/1829"],["sigma-final-m2.png","Phone: final screen 2","813/1829"],["sigma-final-m3.png","Phone: final screen 3","813/1829"],["sigma-final-m4.png","Phone: final screen 4","813/1829"]]},
   {k:"outcome",n:"06",lab:"Outcome",h:"A working prototype.<br>Early signals, not proof.",
    stats:[["Prototype","Working, tested internally at Nolano"],["4 moments","Scope, execute, review, keep: one loop"],["2 surfaces","Desktop and mobile, one colour system"]],
    quotes:[["Claude for spreadsheet. I spend less time fixing spreadsheets and more time analysing.","Ashutosh Kumar Verma · Product Manager"],["No menus, no learning curve, just type what you need and Sigma executes.","Ruby Keller · UX Designer"],["It turns me into a pro Excel user. Love the UI/UX.","Irina Rish · Hedge Fund Founder"]],
    qnote:"From an internal test of the first working prototype.",

 nolano:{src:"Nolano case study.png",tag:"Founding designer · SaaS · 2.5 months",h:"Making AI forecasting accessible to non-technical users.",

  secs:[
   {k:"decision",n:"01",lab:"Context",h:"A forecasting platform built for speed, not just data scientists.",

    img:null,after:""},
   {k:"cards",n:"01.5",lab:"Who we designed for",tint:1,h:"Three types of users. Three different relationships with data.",lead:"Defined through founder discussions and product requirements.",
    cards:[{tg:"Business analyst",t:"Visual user",d:"Uploads business data. Needs to see forecast results clearly without understanding the ML behind it. Judges the product by how fast they get to a chart.",mini:["Playground","Charts","Export"]},{tg:"Developer",t:"API user",d:"Integrates Nolano into their own systems through the API. Needs keys, usage data and documentation without wading through visual tools.",mini:["API keys","Usage","Docs"]},{tg:"First-time user",t:"Evaluator",d:"Hasn't committed yet. Needs to see value immediately without uploading real data. One moment of friction and they leave.",mini:["Sample data","Quick forecast","Zero setup"]}],
    q:"The old version had one layout trying to serve all three. The new version gives each user a clear path."},
   {k:"centered",n:"02",lab:"Problem",h:"The first version tried to serve everyone. It served no one.",lead:"The original dashboard was built to showcase features, not to help users finish tasks.",
    html:`<div style="margin-top:40px">${ph("nolano-before-annotated.png","The old dashboard, API, documentation and keys screens, with numbered callouts","2400/858")}</div><div class="cards c4" style="--n:4;margin-top:20px">${[["1","Wrong dashboard focus","Infrastructure metrics instead of forecasting."],["2","API and charts competing","Split attention on the first screen."],["3","Social mechanics on a B2B tool","The wrong context for the job."],["4","Forecasting below the fold","The core feature was hidden."],["5","No hierarchy in the sidebar","Every item felt equally important."],["6","No clear entry point","Users felt lost."],["7","No search or filter","Users felt less in command."]].map(x=>`<div class="card"><span class="ic">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join("")}</div><p class="pq">“The product was feature-complete but journey-broken.”</p>`},
   {k:"flows",n:"02.5",lab:"Information architecture",tint:1,h:"From circular navigation to a linear task flow.",lead:"The redesign wasn't visual first. It was structural.",
    before:["Land on dashboard","Confused by charts, API and settings all visible","Search for the upload button","Run a forecast in the same cluttered space","Can't find API keys to deploy"],bs:"5+ steps · high friction · no clear path",
    after:["Choose: upload data or try a sample","Configure and run the forecast in the Playground","Get API keys and usage from the top navigation"],as:"3 steps · low friction · clear path"},
   {k:"timeline",n:"03",lab:"Process",h:"High-velocity design in a startup.",lead:"No month-long research cycles. Founder discussions, fast wireframes, real decisions.",
    steps:[["Founder sessions","Mapped technical requirements and found the friction points in the old UI."],["Workflow mapping","Defined 3 core journeys: upload, sample data, API + billing."],["Wireframing","Low-fidelity layout logic validated before any visual decisions."],["Build + refine","Worked alongside engineers, building in Lovable with Figma as the source of truth."]],
    img:["nolano-wireframes.png","Two early wireframes: Home and the forecasting Playground","2800/846","Early wireframes"]},
   {k:"cards",n:"03.5",lab:"Wireframes",tint:1,h:"Layout logic before visual decisions.",lead:"Three layout directions explored. One chosen, and here's why.",
    cards:[{tg:"Explored · rejected",tgc:"rej",img:["nolano-option-dashboard.png","Wireframe: dashboard-first layout","1312/801"],t:"Dashboard-first layout",d:"Everything visible on one screen. Fast to scan, overwhelming for new users, with no clear action hierarchy."},{tg:"Explored · rejected",tgc:"rej",img:["nolano-option-wizard.png","Wireframe: step-by-step wizard","1312/801"],t:"Step-by-step wizard",d:"Guided but slow. We expected returning users to feel trapped in a linear flow they'd already completed."},{tg:"Chosen",tgc:"ok",img:["nolano-option-split.png","Wireframe: split-pane layout","1312/801"],t:"Split-pane layout",d:"Settings on the right, chart on the left. Users see the impact of every configuration change in real time.",pick:"Chosen because it served both first-time users and returning power users without compromising either."}]},
   {k:"decision",n:"04",lab:"Key decision 01",h:"Separating data from execution.",
    p:["In the original UI, uploading data and running a forecast happened in the same cluttered space. There was no separation between “my data” and “my forecast”.","I created a dedicated <b>Datasets library</b>, where users build and manage their data independently of the forecasting workflow. It made both spaces cleaner and gave developers a proper file system."],

   {k:"decision",n:"04",lab:"Key decision 02",rev:1,tint:1,h:"Letting users see value before committing.",
    p:["New users hesitated to upload real business data into a product they hadn't seen work yet, which risks drop-off before anyone runs a forecast.","I added <b>public sample datasets</b> (Bitcoin prices, sports stats, financial time series) that users could forecast with one click, with no upload. This became the main onboarding path and made demos much easier."],
    q:"My idea. It came from noticing that trust had to come before commitment.",
    img:["nolano-playground.png","Playground running a forecast on a public dataset","2400/1464","Playground: a forecast on a public dataset, no upload needed"]},
   {k:"decision",n:"04",lab:"Key decision 03",h:"Treating API access as a first-class feature.",
    p:["Developers were core users of Nolano's API, but in the old version API keys were buried in settings, an afterthought reached through visual chart tools that had nothing to do with their workflow.","I moved <b>API Keys and Usage</b> to the top-level navigation and kept the table minimal and scannable, so developers can find their keys and usage at a glance."],

    img:["nolano-api-keys.png","API Keys table: status visible, add new in one click","2400/1464","API Keys: table layout, status visible"]},
   {k:"gallery",n:"05",lab:"Final designs",tint:1,cols:2,h:"The complete product.",lead:"Core screens, each built around one user task.",

   {k:"outcome",n:"06",lab:"Outcome",h:"Demoed, not launched.",
    stats:[["~$1K MRR","Pre-launch demand recorded by the company"],["Live demos","Used with investors and customers"],["3 steps","To a first forecast, down from 5+"]],

 terralay:{src:"terralay case study.png",tag:"Freelance redesign · Construction tech · Apr–Jun 2026",h:"Redesigning a GIS platform for construction teams who can't afford confusion.",

function caseFull(p){
  document.body.className="case";
  const c=CASES[p.slug],o=READERS[S.reader].order,i=o.indexOf(p.slug),pv=P(o[(i+o.length-1)%o.length]),nx=P(o[(i+1)%o.length]);
  const [st,cls]=STATUS[p.slug];
  const body=c.secs.map(s=>{
    if(s.k==="decision"&&!s.img){ // context section: text + product loop diagram
      return SEC(`<div class="split"><div class="body"><span class="cx-k">${s.n} — ${esc(s.lab)}</span><h2>${s.h}</h2><div style="margin-top:18px">${s.p.map(x=>`<p>${x}</p>`).join("")}</div></div><div><p class="cap" style="margin:0 0 14px">How the product works</p><div class="loop3"><div><b>Dataset</b><small>Upload or explore</small></div><i>→</i><div><b>Playground</b><small>Configure + run</small></div><i>→</i><div><b>API / Output</b><small>Deploy or export</small></div></div></div></div>`);
    }
    return R[s.k](s);
  }).join("");
  app.innerHTML=`<article class="cx ${p.slug}">
   <div class="crumb"><a class="back" href="#" data-go="board">← Board</a><a class="btn" href="#${pv.slug}">← ${esc(pv.title)}</a><a class="btn" href="#${nx.slug}">${esc(nx.title)} →</a><span class="lbl">case ${String(i+1).padStart(2,"0")} / 05 · <b>${esc(p.title)}</b></span></div>
   <div class="wrap">
    <header class="cx-hero"><div><span class="cx-tag">${esc(c.tag)}</span><h1>${esc(c.h)}</h1><p class="lead">${esc(c.lead)}</p><div class="chips">${c.chips.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div><div>${ph(c.hero[0],c.hero[1],c.hero[2],c.hero[3]||"")}</div></header>
    <dl class="cx-facts">${Object.entries(p.facts).map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${k==="Status"?`<span class="st ${cls}" style="margin:0">${st}</span>`:esc(v)}</dd></div>`).join("")}</dl>
   </div>
   ${c.pre||""}
   ${SEC(`<div class="cx-try"><div><div class="demo" data-demo="${p.slug}"></div><div class="dcap" style="margin:6px 0 0"><span>Simplified demo · example data</span><span>${DEMO_CAP[p.slug]}</span></div></div><div><span class="cx-k">Try it first</span><h2 style="font-size:clamp(24px,2.6vw,32px)">The idea in one diff.</h2><div style="margin-top:18px"><div class="dline w">${esc(p.was)}</div><div class="dline n">${esc(p.now)}</div></div></div></div>`,true)}
   ${body}
   <div class="wrap"><nav class="pn" style="padding:40px 0 64px"><a href="#${pv.slug}"><span class="lbl">← previous</span><b>${esc(pv.title)}</b></a><a href="#${nx.slug}"><span class="lbl" style="justify-content:flex-end">next →</span><b>${esc(nx.title)}</b></a></nav></div>
  </article>`;
  app.querySelectorAll(".ph").forEach((f,i)=>{f.querySelector(".phn").textContent=i+1;const s=f.querySelector(".src");if(!s.textContent)s.textContent=c.src;});
  initDemo(app.querySelector(".demo"),p.slug);
  setState(false,"Reading: "+p.title);
  scrollTo(0,0);
}

 chips:["Voice AI agent","Trust and evidence","Mobile"],
 hero:["aurora-01-hero.png","Before: ranked list with INFLIX #1, beside After: screen D “No exact match”","1/1","submission.pdf p1 + Screens.pdf"],
 pre:SEC(`<div class="ax-top"><div class="tl"><span class="cx-k">TL;DR</span><p>Aurora tells you what it's <em>doing</em> (shops found, calls made, a ranking) but not what it <em>learned</em>. In a real search, a call where no one spoke was marked “Success”, and the #1 shop had told Aurora it didn't have the item. I redesigned the search screen around one live answer that grows as calls finish, and only shows as fact what a shop actually said.</p></div>
  <dl class="glance">${[["Project","Aurora: before & after"],["What it was","Take-home design assignment for a Founding Product Designer role"],["Product","A voice AI app that phones local businesses for you (“who has this item, at what price?”) and reports back in a chat"],["My role","Sole designer: audit, research from live usage, problem framing, flows, UI, UX copy, prototype"],["Timeline","November 2026, about one week"],["Tools","Figma, Figma Make, FigJam, Claude as a critique partner"],["Deliverables","2-page submission PDF, clickable Figma prototype, 1-minute walkthrough video"],["Constraint","The backend couldn't change: how Aurora finds businesses, places calls and ranks results stays as it is. Only flow, UI and copy were in scope."]].map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl></div>`,true),
 secs:[
  {k:"html",html:AX("01","Context","What Aurora is.","You type or say what you need, such as “gaming keyboard, wired, mechanical, RGB, under ₹1,500, near Mudholkar Peth, Amravati”. Then Aurora:",
   `<div class="steps arrows" style="margin-top:32px">${[["Finds","Businesses nearby, from maps listings."],["Calls","Each one with an AI voice and asks your question."],["Summarises","A call summary and transcript for each call."],["Ranks","The businesses, with an AI “match” score."]].map((x,i)=>`<div class="step"><span class="n">Step ${i+1}</span><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join("")}</div>
   <p class="pq">All of this happens in a chat thread. A search can run for hours while you're away from the app.</p>
   <div style="margin-top:32px">${ph("aurora-02-original-flow.png","The original end-to-end flow, as I mapped it in FigJam","2800/1976","Section_1.pdf")}</div>`)},
  {k:"html",html:AX("02","How I researched it","I used Aurora for real, and treated each search as a field study.","The brief gave me the app and asked for a redesign. Instead of reviewing it from a few screenshots, I ran real searches.",
   `<div class="cards" style="--n:2">
     <div class="card"><span class="tg">Search 1 · warning signs</span><h3>A gold-tone watch</h3><p>A transcript came out in Spanish while the call was marked “Success”, and the #1 shop had a 0% match. I stopped the search myself; by then it read “52 found · 36 called · 46 ranked · Stopped”, with no answer.</p></div>
     <div class="card"><span class="tg ok">Search 2 · the main evidence</span><h3>A wired mechanical RGB gaming keyboard under ₹1,500</h3><p>In Amravati, a city, so nobody could dismiss the problem as “a remote village with bad data”. It started at 10:19 PM on 11 Nov and ran for more than 12 hours.</p></div></div>
   <div class="out-stats ax4" style="margin-top:28px">${[["109","businesses found within 35.7 km"],["115 · 71","calls placed · shops reached"],["10:21 PM","when the first calls went out"],["0","answers posted in the chat"]].map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}</div>
   <p class="pq">I audited every screen, then separated <b>evidence</b> (what the screen shows) from <b>interpretation</b> (what I think it means). Several of my own first findings didn't survive that test.</p>
   <div style="margin-top:32px"><div class="gal phones" style="--c:4">${[["aurora-03a-chat.jpg","Chat: 109 found, 115 called, 71 reached","The chat after the run: activity, but no answer."],["aurora-03b-calling-live.jpg","Map while calling: 18 done, ranking live","Calling and ranking at the same time."],["aurora-03c-activity-log.jpg","NEXTGEN activity log: calls at 10:21 PM","The first calls went out at 10:21 PM."],["aurora-03d-ranking-complete.jpg","Ranking complete: INFLIX #1, Ratnam ₹2,200","“Ranking Complete!”, with INFLIX at #1."]].map(x=>`<figure>${ph(x[0],x[1],"720/1600","My phone, 11 Nov")}<p class="cap">${x[2]}</p></figure>`).join("")}</div></div>`,true)},
  {k:"html",html:AX("03","What I found","Activity, not answers. And statuses you can't trust.","",
   `<blockquote class="ax-claim">While Aurora calls shops, it reports activity (shops found, calls made, a ranking) but not what it learned, so people can't tell if the item exists, where, or for how much. Its statuses can't be trusted either: a call where no one spoke is marked “Success”, and the #1 shop's own call says it doesn't have the item.</blockquote>
   <p class="ax-sub">The evidence, numbered, because the redesign answers each number.</p>
   <ol class="evl">
    <li><i>①</i><div><h3>The #1 rank contradicts its own call.</h3><p>INFLIX Computers was ranked #1 at a 45% match. On the call, the shop said its keyboard was semi-mechanical and that it had no mechanical keyboard. The rank comes from Aurora's AI score, not from what shops said, and the app never explains the order. The #2 shop, Ratnam Computers (Ratnam Chambers, Rajkamal Sq), was listed at ₹2,200, over my ₹1,500 budget.</p></div></li>
    <li><i>②</i><div><h3>A green tick for something nobody said.</h3><p>INFLIX's card showed a green “✓ Single unit available”. That was never said: the call ended right after the visible transcript. A green tick looks like a confirmed fact, and here it wasn't one.</p></div></li>
    <li><i>③</i><div><h3>The evidence is there, but hidden.</h3><p>INFLIX's own call summary says, in effect, no fully mechanical wired RGB keyboard near ₹1,500. The answer existed. It was buried two taps deep under a ranking that said the opposite.</p></div></li>
    <li><i>④</i><div><h3>“Success” means the line connected, not that anyone learned anything.</h3><p>Pravin Electronics: “Completed · Success · 3.02s” with “No conversation took place”. Its card still showed “1 keyboard” and a price of <b>$250</b>, in dollars, so that data came from somewhere other than the call, and the app doesn't say where. Honest labels already existed in the app (“Did not connect”, “Menu only”), so honest statuses were possible.</p></div></li>
    <li><i>⑤</i><div><h3>Every step ticks green, but the chat never posts an answer.</h3><p>“Businesses discovered! ✓ · Called 71 businesses! ✓ · Ranking Complete! ✓”, and then nothing. With the green #1 row, the screen <em>feels</em> finished and answered when it isn't.</p></div></li>
   </ol>
   <div class="gal" style="--c:3">${[["aurora-04-before-chat.png","Before 1: chat with “Ranking Complete!” and INFLIX #1","callouts ① and ⑤"],["aurora-05-before-inflix.png","Before 2: INFLIX sheet, 45% match, “✓ Single unit available”","callouts ② and ③"],["aurora-06-before-pravin.png","Before 3: Pravin sheet, “Success · 3.02s”, “No conversation took place”","callout ④"]].map(x=>`<figure>${ph(x[0],x[1],"813/1730","submission.pdf p1")}<p class="cap">${x[2]}</p></figure>`).join("")}</div>
   <h3 class="ax-h3">Also found, out of scope but worth saying</h3>
   <div class="cards c4" style="--n:4;margin-top:16px">${[["Calls at night","The first calls went out at 10:21 PM, when most shops are closed or busy."],["Aurora pretended to be a person","On one call it said “Sorry, I'm driving right now, can't check WhatsApp”, breaking its own promise in settings: “I never pretend to be you”. Backend behaviour, so I flagged it rather than redesigned it."],["“Nice find! Share it”","Popped up on a shop whose call said no."],["The radius quietly grew","To 35.7 km, inside a city."]].map(x=>`<div class="card"><span class="ic a">!</span><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join("")}</div>`)},
  {k:"html",html:AX("04","Framing","Choosing what to solve.","I had two candidate problems.",
   `<div class="cards" style="--n:2">
    <div class="card"><span class="tg ok">Chosen</span><h3>A · Progress without answers</h3><p>The search screen reports activity, not knowledge, and its statuses can't be trusted. Every claim in it was visible in my screenshots.</p></div>
    <div class="card"><span class="tg rej">Not chosen</span><h3>B · Losing track over time</h3><p>Home, reopening the app and late-night calling. B only moves a status around: putting a meaningless status on Home doesn't help anyone. Its best idea, Home answering “is it done?”, still fits inside A as one screen.</p></div></div>
   <div class="ax-shift"><span class="cx-k">The shift</span><p>Report what Aurora has <em>learned</em>, not what it has <em>done</em>. Every screen should answer: <b>has anyone got it, and for how much?</b></p></div>`,true)},
  {k:"html",html:AX("05","Exploring directions","Three ways to show what Aurora knows.","",
   `<div class="cards" style="--n:3">
    <div class="card"><span class="tg ok">Chosen</span><h3>Live answer</h3><p>One answer block at the top that grows as calls finish, with calls underneath as evidence.</p><div class="pick">It answers the question first and reads well when you come back. Risk: it starts empty, so the empty state has to work hard.</div></div>
    <div class="card"><span class="tg rej">Not chosen</span><h3>Outcome buckets</h3><p>Shops move between “Has it / No / No answer / Waiting”.</p><p>Shows progress, but feels like a dashboard and is weak at telling you what to do next.</p></div>
    <div class="card"><span class="tg rej">Not chosen</span><h3>Call feed</h3><p>A running log of call outcomes.</p><p>Very transparent, but the answer gets buried in the log, which is today's problem again.</p></div></div>
   <h3 class="ax-h3">Three rules the design follows, all from the evidence</h3>
   <ol class="rules"><li>A claim always sits next to its proof: the shop's quote, a timestamp, or the recording.</li><li>No “confirmed” styling unless a shop actually said it.</li><li>Numbers say what they count: “12 reached”, never “12 done”.</li></ol>`)},
  {k:"html",html:AX("06","Flow","Key states, and one rule for every interruption.","Nothing that was learned gets lost.",
   `<div class="stmap" role="img" aria-label="Flow of key states">
     <div class="row main">${["Request sent","Night check<small>only after 9 PM</small>","A · Calling","B · First lead","D · Answer ready"].map((x,i)=>(i?`<span class="ar">→</span>`:"")+`<div class="st${i>1?" k":""}">${x}</div>`).join("")}</div>
     <div class="row branches"><div class="br"><span>from A</span><div class="st e">D2 · No one picked up<small>retry at 10 AM</small></div></div><div class="br"><span>from B</span><div class="st e">C · Call gets nothing<small>not counted; back to B</small></div></div><div class="br"><span>from D</span><div class="st e">E · Back later<small>Home</small></div></div></div>
     <div class="row"><div class="st w">B2 · Offline<small>can happen from any state; the search keeps running</small></div></div>
   </div>
   <p class="pq">The night check asks before calls start late and offers 10 AM instead. It changes the flow, not the calling, so it stays inside the fixed-backend constraint.</p>
   <div style="margin-top:28px">${ph("aurora-07-flow-map.png","Flow map of key states","2800/706","submission.pdf p1, bottom")}</div>`,true)},
  {k:"html",html:AX("07","Design system","Teal gets one meaning: Aurora heard this.","The brand colour, teal #04AA8A, clashed with my rule “green only for confirmed facts”. I resolved it by giving teal a single job.",
   `<div class="ds">
    <div class="dsc"><h3>Colour roles</h3>
     <div class="sw"><i style="background:#04AA8A"></i><div><b>Teal #04AA8A</b><span>The brand, live activity, and facts heard on a call. Never on buttons. Teal text uses #037A63 for contrast.</span></div></div>
     <div class="sw"><i style="background:#10201C"></i><div><b>Ink #10201C</b><span>Buttons, so colour never means “click me” and “true” at the same time.</span></div></div>
     <div class="pal">${[["Mint","#E3F5F0"],["Peach","#FDEEE2"],["Lilac","#EEEAF7"],["Sky","#E4EFF9"],["Butter","#FBF4D9"],["Mist","#F0F2F1"],["Canvas","#FAFAF8"],["Secondary text","#5B6B66"],["Hairline","#E6E9E6"]].map(x=>`<div><i style="background:${x[1]}"></i><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}</div></div>
    <div class="dsc aur"><h3>Three levels of certainty</h3>
     <div class="fxrow">${fact("heard","<i></i>Wired")}${fact("heard","<i></i>Semi-mechanical")}<span class="fxl">Heard on a call</span></div>
     <div class="fxrow">${fact("nc","1 in stock?")}<span class="fxl">Not checked: listing data the call didn't confirm</span></div>
     <div class="fxrow">${fact("unk","Price")}<span class="fxl">Unknown</span></div>
     <h3 style="margin-top:22px">Type</h3>
     <p class="ty-ui">Closest so far: INFLIX Computers</p><span class="fxl">Plus Jakarta Sans for the UI</span>
     <p class="ty-q">“Wired, but not mechanical.”</p><span class="fxl">Instrument Serif Italic, only for what shops actually said</span>
     <h3 style="margin-top:22px">Copy</h3><p class="fxl" style="font-size:14px">Headlines of 5 words at most, buttons of 2. Short and plain: it says what was heard, and what wasn't.</p></div>
   </div>
   <div style="margin-top:28px">${ph("aurora-08-design-system.png","Design system: colours, fact chips (heard / not checked / unknown), type","2400/1730","Figma file, design system page")}</div>`)},
  {k:"html",html:AX("08","One screen that grows","Watch one screen update, instead of being moved between screens.","Screens A, B and D share one skeleton: header, answer block, live line, calls list. The answer block grows from “Nothing confirmed yet” to a lead, then to a verdict. I found this after my first prototype, where B looked like a different screen from A, and rebuilt all three on shared layers.",
   `<div class="grow">${[["A","Nothing confirmed yet","12 reached"],["B","Closest so far","INFLIX Computers, Itwara Bazar"],["D","No exact match","115 calls · 71 reached"]].map((x,i)=>(i?`<span class="ar">→</span>`:"")+`<div class="gs"><span class="gk">Screen ${x[0]}</span><div class="gb"><small>Answer</small><b>${x[1]}</b><span>${x[2]}</span></div><div class="gl"></div><div class="gl s"></div><div class="gl"></div></div>`).join("")}</div>`,true)},
  {k:"html",html:AX("09","Screens","Six screens, one question: has anyone got it?","",
   `<div class="scr">${[
     ["aurora-09-screen-a.jpg","Screen A","A · Calling: nothing confirmed yet","An honest empty state: “Nothing confirmed yet · 12 reached”. Each call shows its real status (Calling, Ended · 9s, Queued). The header chip shows the real search area, “35.7 km”."],
     ["aurora-10-screen-b.jpg","Screen B","B · First lead: same screen, the block grows","“Closest so far: INFLIX Computers, Itwara Bazar.” Chips: Wired, RGB, Semi-mechanical (heard), Price (unknown), “1 in stock?” (not checked). The shop's own words, “Wired, but not mechanical.”, with a 0:43 timestamp to play. Primary action: Call shop."],
     ["aurora-11-screen-c-pravin.jpg","Screen C, Pravin sheet","C · Call result: Pravin","“Silent · 3s” and “Nothing learned” replace “Success”. The listing's claims show as “Listing says: 1 keyboard? $250?”, clearly not from the call."],
     ["aurora-12-screen-c2-inflix.jpg","Screen C2, INFLIX sheet","C2 · INFLIX sheet","Leads with the verdict, “Close, not exact”, then what was heard, what's unproven, and key moments with timestamps: “Share details on WhatsApp.” 0:18 · “Wired, but not mechanical.” 0:43 · “No.” 0:55, when asked about other mechanical ones. The activity log is folded at the bottom."],
     ["aurora-13-screen-d.jpg","Screen D","D · Answer ready: no exact match, plus the closest","“No exact match · 115 calls · 71 reached.” INFLIX as the closest option, with its proof. A small map with only the 3 shops worth a look. “Try instead” chips: Semi-mechanical, Up to ₹2,500. No #1 badges anywhere. An honest no is more useful than a fake yes."],
     ["aurora-14-screen-e-home.jpg","Screen E, Home","E · Home: back later, status first","The headline is the answer: “No exact match”. A panel shows “71 reached of 109”, one close match (INFLIX) and See answer. Earlier searches sit quietly below."]
    ].map(x=>`<div class="scard">${ph(x[0],x[1],"900/1955","Screens.pdf")}<div><h3>${x[2]}</h3><p>${x[3]}</p><a class="full" href="assets/${x[0]}" target="_blank" rel="noopener">View full screen ↗</a></div></div>`).join("")}</div>`)},
  {k:"html",html:AX("10","Edge and error states","Interruptions that don't lose anything.","",
   `<div class="cards" style="--n:3">${[["Night check","Before calls start after 9 PM, it offers to start at 10 AM instead."],["B2 · Offline","“You're offline. Your search keeps running.” The phone losing signal doesn't stop the search."],["D2 · No one picked up","Nothing was confirmed or ruled out, so it offers to retry at 10 AM."]].map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join("")}</div>
   <div class="scr edge">${[["aurora-15a-night-check.png","Night check"],["aurora-15b-offline.png","B2 · Offline"],["aurora-15c-no-one-picked-up.png","D2 · No one picked up"]].map(x=>`<div class="scard">${ph(x[0],x[1],"800/1704","Screens.pdf")}<p class="cap" style="text-align:center">${x[1]}</p></div>`).join("")}</div>`,true)},
  {k:"html",html:AX("11","Before → After","Every numbered problem, answered.","",
   `<div class="ba">${[["①","INFLIX ranked #1 by AI score, contradicting its own call","No #1 badges; D shows “Closest”, not a rank"],["②","Green ✓ “Single unit available”, never said on the call","Teal chips were heard on the call; peach “?” chips weren't"],["③","The call's evidence hidden two taps deep","The shop's own words on the lead, with a timestamp to play"],["④","“Success” on a 3-second call where no one spoke","“Silent · 3s” and “Nothing learned”"],["⑤","Every step ticked green, no answer ever posted","“Nothing confirmed yet” grows into “No exact match” plus the closest option"]].map(x=>`<div class="bar"><i>${x[0]}</i><div class="dline w">${x[1]}</div><div class="dline n">${x[2]}</div></div>`).join("")}</div>
   <div style="margin-top:32px">${ph("aurora-16-after-row.png","After screens A, B, C, D, E in a row with callouts ①–⑤","21/8","submission.pdf p2")}</div>
   <div class="vid"><video controls playsinline preload="metadata" poster="assets/aurora-17-poster.jpg" width="354" height="766"><source src="assets/aurora-17-walkthrough.mp4" type="video/mp4"></video><p class="cap" style="text-align:center">Prototype walkthrough, about 1 minute.</p></div>`)},
  {k:"html",html:AX("12","Decisions and what I got wrong","Trade-offs, changed minds and stated limits.","",
   `<div class="cards" style="--n:2">
    <div class="card"><span class="tg">Trade-off</span><h3>Fewer, verified results instead of 109 ranked shops</h3><p>It looks less impressive, but it's more trustworthy, and trust is what makes someone actually call the shop.</p></div>
    <div class="card"><span class="tg ok">Kept from today's app</span><h3>Bottom sheets and call recordings</h3><p>People already know them, and the recordings are the proof.</p></div></div>
   <h3 class="ax-h3">Where I changed my mind</h3>
   <div class="wrong">${[["The app “calls at any time”.","I had no evidence until the keyboard search showed calls at 10:21 PM. Only then did the night check go in."],["“The search never ends with an answer.”","In my first search I had stopped it myself, so that wasn't fair. The keyboard search, which finished, confirmed it."],["“The voice sounds unnatural, so people hang up.”","The short calls were real, but the opening line or the language could explain them just as well, so I dropped it as a claim."],["“The ranking is based on the AI overview.”","I kept that as a hypothesis, not a finding, because I couldn't prove it."],["Screen B as a new page.","My first prototype made B feel like a different screen. I rebuilt A, B and D on one shared skeleton so the answer visibly grows in place."]].map(x=>`<div><span class="was">${x[0]}</span><span class="now">${x[1]}</span></div>`).join("")}</div>
   <h3 class="ax-h3">Limits I stated openly</h3>
   <ul class="xl r" style="max-width:70ch">${["The offline state assumes calls continue on Aurora's side. My search kept running with the app closed, but I didn't observe the app offline.","The ranking's basis is inferred from the AI overview, not confirmed.","Discovery, calling and ranking are unchanged."].map(x=>`<li>${x}</li>`).join("")}</ul>`,true)},
  {k:"html",html:AX("13","Measuring success","One metric that shows trust turning into action.","",
   `<div class="metric"><span class="cx-k">Primary metric</span><b>Share of finished searches where the user taps “Call shop” on a result.</b><p>The job of a search is to get someone to a shop that has the item. A tap on Call shop shows the user trusted the answer enough to act on it, which counting screens viewed or calls placed can't show.</p></div>
   <h3 class="ax-h3">Guardrails</h3><ul class="xl g" style="max-width:70ch">${["Time to first lead: an answer that grows should show something useful sooner, not later.","Share of searches the user ends before any answer: if this rises, the honest empty states are reading as failure."].map(x=>`<li>${x}</li>`).join("")}</ul>`)},
  {k:"html",html:AX("14","What I'd do next","Next steps.","",
   `<ul class="xl g" style="max-width:70ch;font-size:16px">${["Test the answer block with 5 people who search for local items, and see whether they trust “heard” over “not checked”.","Bring the honest outcome labels (“Silent”, “Menu only”, “Did not connect”) into call summaries everywhere.","Raise the “pretends to be a person” behaviour with the AI team. It's a trust problem the UI can't fix."].map(x=>`<li>${x}</li>`).join("")}</ul>`,true)},
  {k:"html",html:AX("15","Reflection","What using it for real taught me.","",
   `<div class="reflect" style="max-width:70ch;font-size:17px;line-height:1.6"><p>Screenshots would have shown me a tidy flow with green ticks. Running real searches showed me what the ticks hid: 115 calls, no answer, and a “Success” on a call where no one spoke. None of that is visible until you wait twelve hours for a keyboard.</p><p>Separating evidence from interpretation kept me honest. Two of my first findings, that the voice made people hang up and that the ranking came from the AI overview, didn't survive it, so one became a stated hypothesis and the other was dropped.</p><p>With more time, I'd put the answer block in front of people who actually search for local items, and find out whether they trust what was heard over what was only listed.</p></div>`+
   `<div class="links"><span class="cx-k">Links</span>${[["Prototype","https://www.figma.com/proto/st1fWnc43CtvHnyWKvY6v5/Aurora-AI---Redesign?node-id=39-12537&viewport=-4651%2C-112%2C0.14&t=TGsRsTt0Gwj9Sm9z-1&scaling=scale-down&content-scaling=fixed&page-id=8%3A92"],["Figma file","https://www.figma.com/design/st1fWnc43CtvHnyWKvY6v5/Aurora-AI---Redesign?node-id=41-14963"],["Walkthrough (1 min)","https://drive.google.com/file/d/1SRJRlI_OUXx7BVehe9yw4QvGfgoWKprz/view?usp=sharing"]].map(x=>`<a class="lk" href="${x[1]}" target="_blank" rel="noopener">${x[0]} ↗</a>`).join("")}</div>`)}
 ]};

function demoSigma(el){
  let data=[["Plan","Region","Q3 ₹L","Q4 ₹L"],["Starter","North","12.4","13.1"],["Pro","South","30.2","28.7"],["Team","West","18.0","21.5"],["Enterprise","East","44.9","47.3"]];
  let sel={r0:2,c0:2,r1:3,c1:3},phase="idle",prev=null,drag=null;
  const L="ABCD";
  const inSel=(r,c)=>r>=Math.min(sel.r0,sel.r1)&&r<=Math.max(sel.r0,sel.r1)&&c>=Math.min(sel.c0,sel.c1)&&c<=Math.max(sel.c0,sel.c1);
  const rng=()=>`${L[Math.min(sel.c0,sel.c1)]}${Math.min(sel.r0,sel.r1)+1}${(sel.r0!==sel.r1||sel.c0!==sel.c1)?":"+L[Math.max(sel.c0,sel.c1)]+(Math.max(sel.r0,sel.r1)+1):""}`;
  function draw(changes){
    let h=`<div class="hd"></div>${[...L].map(x=>`<div class="hd">${x}</div>`).join("")}`;
    data.forEach((row,r)=>{h+=`<div class="hd">${r+1}</div>`;row.forEach((v,c)=>{const ch=changes&&changes[r+","+c];const num=r>0&&c>1;
      let cls="c"+(num?" num":"")+(inSel(r,c)&&phase!=="review"?" sel":"");
      let inner=esc(v);
      if(ch==="skip")cls+=" skip";else if(ch){cls+=" chg tall";inner=`<span class="old">${esc(v)}</span><span class="nw">${ch}</span>`;}
      else if(changes)cls+="";
      h+=`<div class="${cls}" data-r="${r}" data-c="${c}">${inner}</div>`;})});
    const cells=[];for(let r=0;r<5;r++)for(let c=0;c<4;c++)if(inSel(r,c))cells.push([r,c]);
    const nNum=cells.filter(([r,c])=>r>0&&c>1).length;
    let bottom;
    if(phase==="review"){const n=Object.values(changes).filter(x=>x!=="skip").length,sk=Object.values(changes).filter(x=>x==="skip").length;
      bottom=`<div class="res"><span>${n} cell${n!==1?"s":""} changed${sk?`, ${sk} skipped (text)`:""} · 0 outside ${rng()}</span><span class="sp"></span><button class="btn" data-a="discard">Discard</button><button class="btn ok" data-a="keep">Keep all</button></div>`;}
    else if(phase==="kept") bottom=`<div class="res"><span>Kept. Nothing changed outside ${rng()}.</span><span class="sp"></span><button class="btn" data-a="undo">Undo</button></div>`;
    else bottom=`<div class="prompt"><span class="sc">${rng()}</span><span class="say">Increase these by 10%</span><button class="go" data-a="run" ${nNum?"":"disabled style='opacity:.4'"}>Run</button></div>`;
    el.innerHTML=`<div class="sheet-demo"><div class="grid5" role="grid" aria-label="Example spreadsheet">${h}</div>${bottom}</div>`;
    const g=el.querySelector(".grid5");
    if(phase!=="review"){
      g.onpointerdown=e=>{const c=e.target.closest(".c");if(!c)return;phase="idle";drag=true;sel={r0:+c.dataset.r,c0:+c.dataset.c,r1:+c.dataset.r,c1:+c.dataset.c};draw();try{el.querySelector(".grid5").setPointerCapture?.(e.pointerId)}catch(_){}}
      g.onpointermove=e=>{if(!drag)return;const t=document.elementFromPoint(e.clientX,e.clientY)?.closest?.(".c");if(!t||!el.contains(t))return;const r=+t.dataset.r,c=+t.dataset.c;if(r!==sel.r1||c!==sel.c1){sel.r1=r;sel.c1=c;draw();}};
      g.onpointerup=g.onpointercancel=()=>{drag=null;};
    }
    el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(b.dataset.a,changes));
  }
  function act(a,changes){
    if(a==="run"){const ch={};for(let r=0;r<5;r++)for(let c=0;c<4;c++)if(inSel(r,c)){if(r>0&&c>1)ch[r+","+c]=(parseFloat(data[r][c])*1.1).toFixed(1);else ch[r+","+c]="skip";}phase="review";draw(ch);}
    if(a==="discard"){phase="idle";draw();}
    if(a==="keep"){prev=data.map(r=>r.slice());Object.entries(changes).forEach(([k,v])=>{if(v==="skip")return;const[r,c]=k.split(",");data[r][c]=v});phase="kept";draw();}
    if(a==="undo"){data=prev;phase="idle";draw();}
  }
  draw();
}

function demoNolano(el){
  const sets={retail:[42,45,44,49,53,51,56,60,58,63,67,64,70,74,72,77],energy:[80,72,66,70,78,86,90,84,76,70,74,82,90,94,88,80]};
  let ds="retail",h=8;const W=560,H=170,N=28,px=10;
  function draw(){
    const y=sets[ds],n=y.length,min=30,max=120;
    const X=i=>px+i*(W-2*px)/(N-1),Y=v=>H-14-(v-min)/(max-min)*(H-28);
    const slope=(y[n-1]-y[n-5])/4,season=ds==="energy"?12:4,per=ds==="energy"?6:4;
    const f=[];for(let j=1;j<=h;j++){const v=y[n-1]+slope*j*.6+season*Math.sin((n+j)*2*Math.PI/per)-season*Math.sin((n)*2*Math.PI/per);f.push([n-1+j,v,3+2.4*Math.sqrt(j)]);}
    const hist=y.map((v,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
    const fl=`M${X(n-1)},${Y(y[n-1])}`+f.map(([i,v])=>`L${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
    const band=`M${X(n-1)},${Y(y[n-1])}`+f.map(([i,v,e])=>`L${X(i).toFixed(1)},${Y(v+e).toFixed(1)}`).join("")+f.slice().reverse().map(([i,v,e])=>`L${X(i).toFixed(1)},${Y(v-e).toFixed(1)}`).join("")+"Z";
    const grid=[0,1,2,3].map(k=>`<line x1="${px}" x2="${W-px}" y1="${14+k*(H-28)/3}" y2="${14+k*(H-28)/3}" stroke="var(--line2)"/>`).join("");
    el.innerHTML=`<div class="chart-demo"><div class="ds" role="group" aria-label="Sample dataset"><button data-ds="retail" aria-pressed="${ds==="retail"}">Sample: retail sales</button><button data-ds="energy" aria-pressed="${ds==="energy"}">Sample: energy load</button></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Forecast of ${h} weeks">${grid}<line x1="${X(n-1)}" x2="${X(n-1)}" y1="8" y2="${H-8}" stroke="var(--ink3)" stroke-dasharray="2 3"/><text x="${X(n-1)+5}" y="16" font-family="JetBrains Mono" font-size="10" fill="var(--ink3)">FORECAST</text><path d="${band}" fill="var(--acc)" opacity=".14"/><path d="${hist}" fill="none" stroke="var(--ink)" stroke-width="1.8"/><path d="${fl}" fill="none" stroke="var(--acc)" stroke-width="1.8" stroke-dasharray="5 4"/></svg>
    <div class="row"><label for="hz-${el.dataset.uid}">HORIZON</label><input id="hz-${el.dataset.uid}" type="range" min="2" max="12" value="${h}"><span>${String(h).padStart(2,"0")} WK</span></div></div>`;
    const r=el.querySelector("input");r.oninput=()=>{h=+r.value;draw();el.querySelector("input").focus();};
    el.querySelectorAll("[data-ds]").forEach(b=>b.onclick=()=>{ds=b.dataset.ds;draw();});
  }
  el.dataset.uid=Math.random().toString(36).slice(2,7);draw();
}

function demoCopilot(el){
  const QS=[["Which datasets is it trained on?","WMT 2014 English–German, about 4.5 million sentence pairs, and the larger WMT 2014 English–French set.<sup>1</sup>","[1] Attention Is All You Need · §5.1 Training data",false],
            ["What did training cost in dollars?","The paper doesn't give a dollar figure. It reports time instead: the big model trained for 3.5 days on 8 P100 GPUs.<sup>2</sup> I won't convert that into a price.","[2] §5.2 Hardware and schedule",true]];
  let k=-1,tok=0;
  function draw(){
    el.innerHTML=`<div class="rag-demo"><div class="qs">${QS.map((q,i)=>`<button data-q="${i}" aria-pressed="${i===k}">${esc(q[0])}</button>`).join("")}</div><div class="out" aria-live="polite">${k<0?"<span style='color:var(--ink3)'>Paper loaded: “Attention Is All You Need”. Pick a question: one is answered with a citation, one is partly refused.</span>":""}</div></div>`;
    el.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{k=+b.dataset.q;draw();type();});
  }
  async function type(){
    const my=++tok,o=el.querySelector(".out"),[,a,src,ref]=QS[k];const plain=a.replace(/<[^>]+>/g,"");
    o.innerHTML=`<span class="caret" style="color:var(--ink3)">Searching one paper</span>`;await wait(450);
    for(let i=0;i<=plain.length;i+=3){if(my!==tok)return;o.innerHTML=`<span class="${ref?"refuse":""}">${esc(plain.slice(0,i))}</span><span class="caret"></span>`;await wait(12);}
    if(my!==tok)return;o.innerHTML=`<span class="${ref?"refuse":""}">${a}</span><div class="src">${esc(src)}</div>`;
  }
  draw();
}

/* ---------- routing ---------- */
let lastHome=0;
document.addEventListener("click",e=>{const a=e.target.closest("[data-go]");if(!a)return;e.preventDefault();const g=a.dataset.go;
  if(location.hash&&location.hash!=="#"){pendingGo=g;history.pushState("",document.title,location.pathname+location.search);route();}else go(g);});
let pendingGo=null;
function go(g){const el=g==="about"?$("#about"):$("#board-top");if(el)el.scrollIntoView({behavior:reduce?"auto":"smooth"});}
function route(){
  const h=location.hash.slice(1),p=P(h);
  if(p){if(document.body.classList.contains("home"))lastHome=scrollY;caseStudy(p);}
  else{home();if(pendingGo){const g=pendingGo;pendingGo=null;requestAnimationFrame(()=>go(g));}else if(lastHome)requestAnimationFrame(()=>scrollTo(0,lastHome));}
}
addEventListener("hashchange",route);
addEventListener("popstate",route);
let lastW=innerWidth;addEventListener("resize",()=>{if((lastW>900)!==(innerWidth>900)&&document.body.classList.contains("home")){renderAsk();}lastW=innerWidth;});
route();
</script>
